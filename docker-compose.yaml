services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d student"]
      interval: 5s
      retries: 10

  # Полный стек в контейнерах: docker compose --profile full up --build
  app:
    profiles: ["full"]
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    ports: ["${APP_PORT}:${APP_PORT}"]

volumes:
  pgdata:
