<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Заявки</title>
    <link href="css/table.css" rel="stylesheet" type="text/css">
</head>


<body>
    <form action="" method="get" class="form-example">
        <div class="form-example">
            <label for="name">Enter your name: </label>
            <input type="text" name="name" id="name" required />
        </div>
        <div class="form-example">
            <label for="group">Enter your group: </label>
            <input type="text" group="group" id="group" required />
        </div>
        <div class="form-example">
            <label for="isu">Enter your isu: </label>
            <input type="number" isu="isu" id="isu" required />
        </div>
        <div class="form-example">
            <label for="dorm">Enter your dorm: </label>
            <input type="number" dorm="dorm" id="dorm" required />
        </div>
        <div class="form-example">
            <label for="room">Enter your room: </label>
            <input type="number" room="room" id="room" required />
        </div>
        <div class="form-example">
            <label for="date">Enter your date: </label>
            <input type="date" date="date" id="date" required />
        </div>
        <div class="form-example">
            <input type="submit" value="Subscribe!" />
        </div>
    </form>
    <button onclick="location.href = 'index.html';" id="myButton" class="float-left submit-button">Home</button>

</body>
