<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title id="mainTitle">Регистрация</title>
    <link rel="stylesheet" href="css/form.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<header class="page-header">
    <h1 id="auth-title">Регистрация</h1>
</header>

<body>
<form name="registration" id="reg-form">
    <div class="form-group">
        <label>Логин
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Иванов Иван Иванович"
                   required>
        </label>
    </div>

    <div class="form-group">
        <label>Почта
            <input id="email" name="email" type="email" pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}" autocomplete="email" placeholder="example@example.com"
                   required>
        </label>
    </div>

    <div class="form-group">
        <label>Пароль
            <input id="password" name="password" type="password" autocomplete="new-password"
                   required>
        </label>
    </div>

    <div class="form-group">
        <label>Повторите пароль
            <input id="password-submit" name="password-submit" type="password" autocomplete="off"
                   required>
        </label>
    </div>

    <button type="submit" id="submit-btn">Готово</button>
    <button type="button" id="login-btn">Есть аккаунт? Войти</button>
</form>

<form name="login" id="login-form" hidden>
    <div class="form-group">
        <label>Логин или email
            <input id="login-username" name="username" type="text" autocomplete="username"
                   required>
        </label>
    </div>

    <div class="form-group">
        <label>Пароль
            <input id="login-password" name="password" type="password" autocomplete="current-password"
                   required>
        </label>
    </div>

    <button type="submit">Войти</button>
    <button type="button" id="register-btn">Нет аккаунта? Зарегестрироваться</button>
</form>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/reg_form.js"></script>
</body>

</html>
