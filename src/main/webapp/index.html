<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Заявки</title>
    <link href="css/table.css" rel="stylesheet" type="text/css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <h1>Студенты</h1>
    <section class="filters">
        <div class="filter-field">
            <label for="filterFullName">ФИО</label>
            <input
                    type="text"
                    id="filterFullName"
                    placeholder="Например, Евгений"
            >
        </div>

        <div class="filter-field">
            <label for="filterGroup">Группа</label>
            <input
                    type="text"
                    id="filterGroup"
                    placeholder="Например, P3120"
                    pattern="[A-Z][1-9][1-4][0-9]{2}"
            >
        </div>

        <div class="filter-field">
            <label for="filterIsuId">ИСУ ID</label>
            <input
                    type="number"
                    id="filterIsuId"
                    min="100000"
                    max="999999"
            >
        </div>

        <div class="filter-field">
            <label for="filterDormitory">Общежитие</label>
            <input
                    type="number"
                    id="filterDormitory"
                    min="1"
                    max="99"
            >
        </div>

        <div class="filter-field">
            <label for="filterRoom">Комната</label>
            <input
                    type="number"
                    id="filterRoom"
                    min="1"
                    max="9999"
            >
        </div>

        <div class="filter-field">
            <label for="filterMoveInDate">Дата заселения</label>
            <input
                    type="date"
                    id="filterMoveInDate"
            >
        </div>

        <div class="filter-field">
            <label for="filterIsForeign">Иностранный студент</label>
            <select id="filterIsForeign">
                <option value="">Все</option>
                <option value="true">Да</option>
                <option value="false">Нет</option>
            </select>
        </div>

        <div class="filter-field">
            <label for="filterNotes">Заметки</label>
            <input
                    type="text"
                    id="filterNotes"
                    placeholder="Поиск по тексту"
            >
        </div>

        <div class="filter-actions">
            <button type="button" id="applyFilters">Найти</button>
            <button type="button" id="resetFilters">Сбросить</button>
        </div>
    </section>
    <div class="table-wrapper">
        <table id="studsTable">
            <tbody>
                <tr>
                    <td>ФИО</td>
                    <td>Группа</td>
                    <td>ИСУ ID</td>
                    <td>Общежитие</td>
                    <td>Комната</td>
                    <td>Срок заселения</td>
                    <td>Действия</td>
                </tr>
            </tbody>
        </table>
    </div>
    <button onclick="location.href = 'form.html';" id="myButton" class="float-left submit-button">Добавить
        студента</button>
    <script type="text/javascript" src="js/db.js"></script>
    <script type="text/javascript" src="js/index.js"></script>
</body>

</html>
